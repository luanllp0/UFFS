{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>Acesso ao PUMA</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger p-2 text-center">
                            Nome de utilizador ou palavra-passe incorretos.
                        </div>
                    {% endif %}
                    
                    <div class="form-group">
                        <label for="id_username">Nome de Utilizador</label>
                        {{ form.username }}
                    </div>
                    
                    <div class="form-group">
                        <label for="id_password">Palavra-passe</label>
                        {{ form.password }}
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block mt-4">Entrar</button>
                </form>
                <div class="text-center mt-3">
                    <p>Não tem uma conta? <a href="{% url 'signup' %}">Registe-se aqui</a>.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('id_username').classList.add('form-control');
    document.getElementById('id_password').classList.add('form-control');
</script>
{% endblock %}
