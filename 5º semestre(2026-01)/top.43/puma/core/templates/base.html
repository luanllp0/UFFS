{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>PUMA - UFFS</title>
    
    <!-- Bootstrap (pode ser o seu local se você baixou, ou via link) -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    
    <!-- O seu CSS customizado -->
    <!-- <link rel="stylesheet" href="{% static 'css/seu_arquivo.css' %}"> -->
</head>
<body>
    <!-- Navbar padrão -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <a class="navbar-brand" href="/">PUMA - Monitoria</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="/">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Agendamentos</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- O bloco onde o conteúdo das outras páginas vai entrar -->
        {% block content %}
        {% endblock %}
    </div>

    <!-- Scripts do Bootstrap e o seu JS customizado -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
    <!-- <script src="{% static 'js/seu_arquivo.js' %}"></script> -->
</body>
</html>
